<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apostila - Rota do Concurso</title>
<style>
  body{font:12pt/1.5 Georgia,"Times New Roman",serif;color:#111;max-width:760px;margin:0 auto;padding:16px}
  h1{font:700 22pt system-ui,sans-serif;margin:0 0 4pt}
  h2{font:700 16pt system-ui,sans-serif;border-bottom:2px solid #1d4ed8;padding-bottom:3pt;margin:22pt 0 8pt;break-after:avoid}
  h3{font:700 12.5pt system-ui,sans-serif;margin:12pt 0 3pt;color:#1d4ed8;break-after:avoid}
  .capa{border:2px solid #1d4ed8;border-radius:8px;padding:14pt 16pt;margin-bottom:14pt}
  .aviso{background:#fef3c7;border-left:4px solid #b45309;padding:6pt 10pt;font:10pt system-ui,sans-serif;margin:8pt 0}
  .topico{break-inside:auto}
  .q{margin:8pt 0;break-inside:avoid}
  .alts{margin:3pt 0 0 0;padding-left:0;list-style:none}
  .alts li{margin:2pt 0}
  .mut{color:#555;font:10pt system-ui,sans-serif}
  ul{padding-left:16pt}
  .gab{break-before:page}
  .gab p{margin:4pt 0;font-size:10.5pt}
  .gq{break-inside:avoid;margin-bottom:6pt}
  .gx{margin:2pt 0 4pt 0;padding-left:14pt;font-size:9.5pt;list-style:none}
  .gx li{margin:1pt 0}
  .mat{break-before:page}
  .mat:first-of-type{break-before:auto}
</style>
</head>
<body>
<div id="out"></div>
<script src="data/core.js"></script>
<script src="data/portugues.js"></script>
<script src="data/logica.js"></script>
<script src="data/legislacao.js"></script>
<script src="data/especificos.js"></script>
<script src="data/gerais.js"></script>
<script src="data/superior.js"></script>
<script src="data/coment-portugues.js"></script>
<script src="data/coment-logica.js"></script>
<script src="data/coment-legislacao.js"></script>
<script src="data/coment-especificos.js"></script>
<script src="data/coment-gerais.js"></script>
<script src="data/extra.js"></script>
<script src="data/extra2.js"></script>
<script src="data/edital-legislacao.js"></script>
<script src="data/pf.js"></script>
<script src="data/pf-questoes.js"></script>
<script>
(function () {
  var C = window.CONC, L = ['A', 'B', 'C', 'D', 'E'];
  var qs0 = new URLSearchParams(location.search), id = qs0.get('m') || 'all', nv = qs0.get('nv') || 'medio', cid = qs0.get('c') || '';
  var CC = C.concursos.filter(function (x) { return x.id === cid; })[0];
  var NOME = C.niveis.filter(function (n) { return n.id === nv; })[0].nome;
  function vis(t) { if (t.nv.indexOf(nv) < 0) return false; return CC && CC.esfera === 'federal' ? (t.so ? t.so.indexOf(CC.id) >= 0 : t.pf === true) : !t.so; }
  function visQ(q) { var m = C.materias.filter(function (x) { return x.id === q.m; })[0]; return vis(m.topicos.filter(function (t) { return t.id === q.t; })[0]); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var ms = C.materias.filter(function (m) { return (id === 'all' || m.id === id) && m.topicos.some(vis); });
  var titulo = id === 'all' ? 'Apostila completa' : ms[0].nome;
  document.title = 'Apostila - ' + titulo;
  var h = '<div class="capa"><div class="mut">' + (CC ? CC.nome + ' · ' : 'Concursos de Porto Velho/RO 2026 · ') + NOME + ' · banca ' + (CC ? CC.banca : 'IBGP') + '</div><h1>' + esc(titulo) + '</h1>' +
    '<div class="mut">Material original em 3 camadas: contexto → básico → aprofundado. Gerado em ' + new Date().toLocaleDateString('pt-BR') + '.</div></div>' +
    '<div class="aviso"><b>Atenção:</b> o conteúdo é <b>provável</b>. O Anexo IV do edital nº 24/2026 (conteúdo programático oficial) não estava no PDF consultado; os itens marcados <b>A CONFIRMAR NO EDITAL</b> devem ser conferidos em www.ibgpconcursos.com.br. Textos e questões foram escritos do zero, sem copiar provas ou apostilas.</div>';
  ms.forEach(function (m) {
    h += '<section class="mat"><h1 style="color:' + m.cor + '">' + esc(m.nome) + '</h1><div class="mut">' + (nv === 'medio' ? 'Prova SEMED (nível médio): ' + m.questoes + ' questões (' + m.peso + ')' : 'Distribuição de questões neste nível: A CONFIRMAR NO EDITAL') + '</div><p class="mut">' + esc(m.banca) + '</p>';
    m.topicos.filter(vis).forEach(function (t, i) {
      h += '<div class="topico"><h2>' + (i + 1) + '. ' + esc(t.titulo) + '</h2>' +
        '<h3>Contexto</h3>' + t.contexto + '<h3>Resumo básico</h3>' + t.basico + '<h3>Aprofundamento</h3>' + t.aprofundado + '</div>';
    });
    var qs = C.questoes.filter(function (q) { return q.m === m.id && visQ(q); });
    h += '<h2>Exercícios</h2>';
    qs.forEach(function (q, i) {
      h += '<div class="q"><b>' + (i + 1) + '.</b> ' + esc(q.q) + '<ul class="alts">' + q.a.map(function (a, k) { return '<li>' + L[k] + ') ' + esc(a) + '</li>'; }).join('') + '</ul></div>';
    });
    h += '<div class="gab"><h2>Gabarito comentado - ' + esc(m.nome) + '</h2>' + qs.map(function (q, i) {
      var x = C.x && C.x[q.id];
      return '<div class="gq"><p><b>' + (i + 1) + ' - ' + L[q.g] + '.</b> ' + esc(q.e) + '</p>' + (x ? '<ul class="gx">' + x.map(function (t, k) { return '<li><b>' + L[k] + (k === q.g ? ' (certa)' : '') + ':</b> ' + esc(t) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
    }).join('') + '</div></section>';
  });
  document.getElementById('out').innerHTML = h;
  document.body.setAttribute('data-ready', '1');
})();
</script>
</body>
</html>
